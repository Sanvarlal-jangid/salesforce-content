<template>
    <div class="slds-grid slds-wrap slds-var-p-around_medium">
        <div class="slds-col slds-size_12-of-12 slds-medium-size_8-of-12 slds-large-size_9-of-12">
            <lightning-card title="Available Products" icon-name="standard:product">
                <div class="slds-grid slds-wrap slds-p-around_medium">
                    <template for:each={products} for:item="product">
                        <lightning-layout-item key={product.id} size="12" large-device-size="4" medium-device-size="6" small-device-size="12" class="slds-m-bottom_medium">
                            <div class="slds-box slds-var-m-around_x-small product-card">
                                <img src={imageUrl} alt={product.name} class="product-image">
                                <h2 class="slds-text-heading_medium slds-m-bottom_small">{product.Name}</h2>
                                <p class="slds-text-body_regular slds-m-bottom_x-small">{product.description}</p>
                                <p class="slds-text-heading_small slds-m-bottom_small">Price: ${product.price}</p>
                                <lightning-button variant="brand" label="Add to Cart" onclick={addToCart} data-item-id={product.id}></lightning-button>
                            </div>
                        </lightning-layout-item>
                    </template>
                </div>
            </lightning-card>
        </div>

        <div class="slds-col slds-size_12-of-12 slds-medium-size_4-of-12 slds-large-size_3-of-12">
            <lightning-card title="Your Cart" icon-name="standard:cart">
                <div class="slds-p-around_medium">
                    <template if:true={cartItems}>
                        <ul class="slds-list_vertical slds-list_vertical-space">
                            <template for:each={cartItems} for:item="item">
                                <li key={item.id} class="slds-var-m-bottom_medium slds-border_bottom">
                                    <div class="slds-grid slds-grid_align-spread slds-wrap">
                                        <div style="display:flex">
                                            <img src={imageUrl}  class="product-item">
                                            <p class="slds-text-title_bold"><strong>name:{item.Name}</strong></p>
                                            <p class="slds-text-body_small"><strong>Qty: {item.quantity}</strong></p>
                                            <p class="slds-text-body_small"><strong>price: {item.price}</strong></p>
                                              <div class="slds-grid slds-grid_vertical-align-center">
                                            <lightning-button-icon
                                                icon-name="utility:dash"
                                                title="Decrease Quantity"
                                                onclick={handleQuantityChange}
                                                data-item-id={item.id}
                                                data-action="decrease"
                                                class="slds-var-m-right_x-small"
                                                disabled={item.isMinQuantity}
                                            ></lightning-button-icon>
                                            <span class="slds-text-heading_small slds-var-m-horizontal_x-small">{item.quantity}</span>
                                            <lightning-button-icon
                                                icon-name="utility:add"
                                                title="Increase Quantity"
                                                onclick={handleQuantityChange}
                                                data-item-id={item.id}
                                                data-action="increase"
                                                class="slds-var-m-left_x-small"
                                            ></lightning-button-icon>
                                            <lightning-button-icon 
                                                icon-name="utility:delete" 
                                                alternative-text="Remove" 
                                                title="Remove from Cart" 
                                                data-item-id={item.id} 
                                                onclick={removeFromCart}
                                                class="slds-var-m-left_small"
                                            ></lightning-button-icon>
                                        </div>
                                        </div>
                                      
                                    </div>
                                </li>
                            </template>
                        </ul>
                        <hr class="slds-var-m-vertical_medium">
                        <div class="slds-grid slds-grid_align-spread slds-text-heading_medium slds-var-m-top_medium">
                            <span>Total:</span>
                            <span>${cartTotal}</span>
                        </div>
                        <div class="slds-var-m-top_medium">
                            <lightning-button label="Close" onclick={handleCheckout}></lightning-button>
                             <lightning-button variant="success" label="Place Order" onclick={createrecord}></lightning-button>
                        </div>
                    </template>
                   
                </div>
            </lightning-card>
        </div>
    </div>
</template>
