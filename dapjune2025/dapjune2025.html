<template>
    <lightning-card title="Tasks Kanban Board" icon-name="utility:kanban">
        <div class="slds-p-around_medium">
            <lightning-layout horizontal-align="space" multiple-rows="false">

                <lightning-layout-item size="3" small-device-size="12" medium-device-size="6" large-device-size="3"
                    class="slds-p-horizontal_small column-todo"
                    ondragover={handleDragOver} ondrop={handleDrop} data-status="To Do">
                    <div class="kanban-column">
                        <h2 class="kanban-column-header slds-var-p-around_x-small">To Do ({tasks.todo.length})</h2>
                        <div class="kanban-column-body slds-var-p-around_x-small">
                            <template for:each={tasks.todo} for:item="task">
                                <div key={task.Id} class="task-card" draggable="true"
                                    data-id={task.Id}
                                    data-status={task.Status__c}
                                    onclick={handleCardClick}
                                    ondragstart={handleDragStart}>
                                    <div class="task-card-header">
                                        <h3 class="task-name">{task.Task_Name__c}</h3>
                                        <span class={task.priorityClass}>{task.Priority__c}</span>
                                        <lightning-button-icon icon-name="utility:edit" size="small"
                                            alternative-text="Edit Task"
                                            class="edit-icon"
                                            data-id={task.Id}
                                            onclick={handleEditIconClick}
                                            title="Edit Task"></lightning-button-icon>
                                    </div>
                                    <div class="task-info">
                                        <p>Assigned To: {task.Assigned_To__r.Name}</p>
                                        <p>Due Date: {task.formattedDueDate}</p>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </lightning-layout-item>

                <lightning-layout-item size="3" small-device-size="12" medium-device-size="6" large-device-size="3"
                    class="slds-p-horizontal_small column-in-progress"
                    ondragover={handleDragOver} ondrop={handleDrop} data-status="In Progress">
                    <div class="kanban-column">
                        <h2 class="kanban-column-header slds-var-p-around_x-small">In Progress ({tasks.inProgress.length})</h2>
                        <div class="kanban-column-body slds-var-p-around_x-small">
                            <template for:each={tasks.inProgress} for:item="task">
                                <div key={task.Id} class="task-card" draggable="true"
                                    data-id={task.Id}
                                    data-status={task.Status__c}
                                    onclick={handleCardClick}
                                    ondragstart={handleDragStart}>
                                    <div class="task-card-header">
                                        <h3 class="task-name">{task.Task_Name__c}</h3>
                                        <span class={task.priorityClass}>{task.Priority__c}</span>
                                        <lightning-button-icon icon-name="utility:edit" size="small"
                                            alternative-text="Edit Task"
                                            class="edit-icon"
                                            data-id={task.Id}
                                            onclick={handleEditIconClick}
                                            title="Edit Task"></lightning-button-icon>
                                    </div>
                                    <div class="task-info">
                                        <p>Assigned To: {task.Assigned_To__r.Name}</p>
                                        <p>Due Date: {task.formattedDueDate}</p>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </lightning-layout-item>

                <lightning-layout-item size="3" small-device-size="12" medium-device-size="6" large-device-size="3"
                    class="slds-p-horizontal_small column-testing"
                    ondragover={handleDragOver} ondrop={handleDrop} data-status="Testing">
                    <div class="kanban-column">
                        <h2 class="kanban-column-header slds-var-p-around_x-small">Testing ({tasks.testing.length})</h2>
                        <div class="kanban-column-body slds-var-p-around_x-small">
                            <template for:each={tasks.testing} for:item="task">
                                <div key={task.Id} class="task-card" draggable="true"
                                    data-id={task.Id}
                                    data-status={task.Status__c}
                                    onclick={handleCardClick}
                                    ondragstart={handleDragStart}>
                                    <div class="task-card-header">
                                        <h3 class="task-name">{task.Task_Name__c}</h3>
                                        <span class={task.priorityClass}>{task.Priority__c}</span>
                                        <lightning-button-icon icon-name="utility:edit" size="small"
                                            alternative-text="Edit Task"
                                            class="edit-icon"
                                            data-id={task.Id}
                                            onclick={handleEditIconClick}
                                            title="Edit Task"></lightning-button-icon>
                                    </div>
                                    <div class="task-info">
                                        <p>Assigned To: {task.Assigned_To__r.Name}</p>
                                        <p>Due Date: {task.formattedDueDate}</p>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </lightning-layout-item>

                <lightning-layout-item size="3" small-device-size="12" medium-device-size="6" large-device-size="3"
                    class="slds-p-horizontal_small column-completed"
                    ondragover={handleDragOver} ondrop={handleDrop} data-status="Completed">
                    <div class="kanban-column">
                        <h2 class="kanban-column-header slds-var-p-around_x-small">Completed ({tasks.completed.length})</h2>
                        <div class="kanban-column-body slds-var-p-around_x-small">
                            <template for:each={tasks.completed} for:item="task">
                                <div key={task.Id} class="task-card" draggable="true"
                                    data-id={task.Id}
                                    data-status={task.Status__c}
                                    onclick={handleCardClick}
                                    ondragstart={handleDragStart}>
                                    <div class="task-card-header">
                                        <h3 class="task-name">{task.Task_Name__c}</h3>
                                        <span class={task.priorityClass}>{task.Priority__c}</span>
                                        <lightning-button-icon icon-name="utility:edit" size="small"
                                            alternative-text="Edit Task"
                                            class="edit-icon"
                                            data-id={task.Id}
                                            onclick={handleEditIconClick}
                                            title="Edit Task"></lightning-button-icon>
                                    </div>
                                    <div class="task-info">
                                        <p>Assigned To: {task.Assigned_To__r.Name}</p>
                                        <p>Due Date: {task.formattedDueDate}</p>
                                    </div>
                                </div>
                            </template>
                        </div>
                    </div>
                </lightning-layout-item>

            </lightning-layout>
        </div>

        <template if:true={isModalOpen}>
            <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true" aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse" title="Close" onclick={closeModal}>
                            <lightning-icon icon-name="utility:close" size="small"></lightning-icon>
                            <span class="slds-assistive-text">Close</span>
                        </button>
                        <h2 id="modal-heading-01" class="slds-modal__title slds-hyphenate">Edit Task</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1">
                        <lightning-record-edit-form record-id={selectedTask.Id} object-api-name="Project_Task__c">
                            <lightning-messages></lightning-messages>
                            <template for:each={fieldSetFields} for:item="field">
                                <div key={field.fieldName} class="slds-var-m-bottom_small">
                                    <!-- <lightning-input-field
                                        field-name={field.fieldName}
                                        value={selectedTask[field.fieldName]}
                                        onchange={handleFieldChange}
                                     
                                        data-field={field.fieldName}>
                                    </lightning-input-field> -->
                                </div>
                            </template>
                            <!-- <div if:true={clientValidationError} class="slds-text-color_error slds-p-around_x-small">
                                {clientValidationError}
                            </div> -->
                        </lightning-record-edit-form>
                    </div>
                    <footer class="slds-modal__footer">
                        <button class="slds-button slds-button_neutral" onclick={closeModal}>Cancel</button>
                        <lightning-button variant="brand" label="Save" onclick={handleModalSave} disabled={isSaving}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </lightning-card>
</template>
