<template>
    <lightning-card title="Order placement component">
        <div class="slds-p-around_medium">
            <lightning-input label="Customer Name" value={customerName} onchange={handleNameChange}></lightning-input>
            <lightning-combobox
                label="Select Item"
                value={item}
                options={itemOptions}
                onchange={handleItemChange}>
            </lightning-combobox>
            <lightning-input type="number" label="Quantity" value={quantity} onchange={handleQuantityChange}></lightning-input>
            <lightning-button label="Place Order" variant="brand" onclick={handlePlaceOrder} class="slds-m-top_medium"></lightning-button>
        </div>
    </lightning-card>
</template>
