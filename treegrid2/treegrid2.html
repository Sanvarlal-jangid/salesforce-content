<template>
    <lightning-card title="Opportunities Tree">
        <!-- Buttons -->
        <div class="slds-m-around_small">
            <lightning-button label="Expand All" onclick={handleExpandAll}></lightning-button>
            <lightning-button label="Collapse All" onclick={handleCollapseAll} class="slds-m-left_small"></lightning-button>
        </div>

        <!-- Tree Grid -->
        <lightning-tree-grid
            key-field="name"
            columns={columns}
            data={gridData}
            onrowaction={handleRowAction}
           >
        </lightning-tree-grid>

        <!-- Modal for File Upload -->
        <template if:true={selectedOppId}>
            <section role="dialog" tabindex="-1" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <h2 class="slds-text-heading_medium">Upload File</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-file-upload
                            label="Upload File"
                            record-id={selectedOppId}
                            onuploadfinished={handleUploadFinished}>
                        </lightning-file-upload>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button variant="neutral" label="Close" onclick={closeModal}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </lightning-card>
</template>
