<template>
    <lightning-card class="slds-grid slds-wrap slds-grid_align-center">


        <lightning-button variant="brand" class="slds-var-m-around_medium" data-object="Account" label="Account"
            title="Open popup" onclick={showModalBox}>
        </lightning-button>

        <lightning-button variant="success" class="slds-var-m-around_medium" data-object="Contact" label="contact"
            title="Open popup" onclick={showModalBox}> </lightning-button>

        <lightning-button variant="brand" class="oppbutton slds-var-m-around_medium" label="Opportunitiy"
            data-object="Opportunity" title="Open popup" onclick={showModalBox}> </lightning-button>

        <lightning-button variant="Destructive" class="slds-var-m-around_medium" data-object="Lead" label="Lead"
            title="Open popup" onclick={showModalBox}> </lightning-button>
    </lightning-card>
    <!-- modal start -->
    <template if:true={isShowModal}>



        <section role="dialog" tabindex="-1" aria-labelledby="modal-heading-01" aria-modal="true"
            aria-describedby="modal-content-id-1" class="slds-modal slds-fade-in-open">
            <div class="slds-modal__container">

                <header class="slds-modal__header">
                    <button class="slds-button slds-button_icon slds-modal__close slds-button_icon-inverse"
                        title="Close" onclick={hideModalBox}>
                        <lightning-icon icon-name="utility:close" alternative-text="close" variant="inverse"
                            size="small"></lightning-icon>
                        <span class="slds-assistive-text">Close</span>
                    </button>
                    <h2 id="modal-heading-01" class="slds-text-heading_medium slds-hyphenate">Are you sure </h2>
                </header>


                <div class="slds-modal__content slds-p-around_medium" id="modal-content-id-1" style="text-align: center;">
                    <button class="slds-button slds-button_neutral" onclick={hideModalBox}>Cancel</button>

                    <lightning-button variant="brand" class="green slds-var-m-around_medium" label="Proceed"
                        onclick={proceedToForm}> </lightning-button>
                </div>


                <footer class="slds-modal__footer">

                </footer>

            </div>
        </section>
        <div class="slds-backdrop slds-backdrop_open"></div>
    </template>
    <!-- modal end -->

</template>
