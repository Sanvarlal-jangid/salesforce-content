<template>
    <lightning-card title="Opportunity Tracker">
        <!-- 🔍 Search Filters -->
        <div class="slds-p-around_medium slds-grid slds-gutters">
            <div class="slds-col slds-size_1-of-2">
                <lightning-input
                    label="Search by Name"
                    value={nameFilter}
                    onchange={handleNameChange}>
                </lightning-input>
            </div>
            <div class="slds-col slds-size_1-of-2">
                <lightning-input
                    label="Search by Status"
                    value={statusFilter}
                    onchange={handleStatusChange}>
                </lightning-input>
            </div>
        </div>

        <div class="slds-p-around_medium">
            <lightning-button
                label="Search"
                variant="brand"
                onclick={handleSearch}>
            </lightning-button>
        </div>

        <!-- 📋 Opportunity Table -->
        <div class="slds-p-around_medium">
            <lightning-datatable
                key-field="Id"
                data={opportunities}
                columns={columns}
                onrowselection={handleRowSelection}>
            </lightning-datatable>
        </div>

        <!-- 🔁 Mass Update Status -->
        <div class="slds-p-around_medium slds-grid slds-gutters">
            <div class="slds-col slds-size_1-of-2">
                <lightning-combobox
                    label="Update Status To"
                    value={newStatus}
                    options={statusOptions}
                    onchange={handleNewStatusChange}>
                </lightning-combobox>
            </div>
            <div class="slds-col slds-size_1-of-2 slds-align-bottom">
                <lightning-button
                    label="Update Selected"
                    variant="success"
                    onclick={handleUpdateStatus}>
                </lightning-button>
            </div>
        </div>
    </lightning-card>
</template>
