<template>
    <div class="slds-box slds-p-around_none slds-m-top_x-small slds-m-bottom_medium slds-m-horizontal_none">
        <lightning-layout>
            <lightning-layout-item padding="around-small" class="custom-box">
                <div class="slds-text-heading_large">Prospecting</div>
                <div data-id="prospectingList" style="height:100%" data-role="drop-target" ondrop={handleDrop}
                    class="scroll-zone slds-scrollable_y" ondragenter={handleDragEnter} onscroll={handleScroll}
                    ondragover={handleDragOver} ondragleave={handleDragLeave}>

                    <template if:true={prospectingList}>
                        <template for:each={prospectingList} for:item="data">
                            <div key={data.Id} draggable="true" id={data.Id} data-id={data.Id}
                                ondragstart={taskDragStart} ondragend={taskDragEnd} class="slds-p-around_small">
                                <lightning-card style="padding: 10px;" variant="Narrow">
                                    <div class="slds-p-around_medium">
                                        <p><strong>{data.Name}</strong></p>
                                        <p>{data.Amount}</p>
                                        <p>{data.StageName}</p>
                                        <div style="display: flex; justify-content: space-between;">
                                            <lightning-button label="Edit" title="Non-primary action"
                                                onclick={handleEditClick} data-id={data.Id}
                                                class="slds-m-left_x-small"></lightning-button>
                                            <lightning-button label="Delete" title="Non-primary action"
                                                onclick={handledeleteClick} data-id={data.Id}
                                                class="slds-m-left_x-small"></lightning-button>
                                        </div>
                                    </div>
                                </lightning-card>
                            </div>
                        </template>
                    </template>
                    <template if:true={isLoadingProspecting}>
                        <div class="slds-align_absolute-center slds-p-vertical_medium">
                            <lightning-spinner alternative-text="Loading..." size="small"></lightning-spinner>
                        </div>
                    </template>
                    <template if:true={allDoneProspecting}>
                        <div class="slds-text-align_center slds-text-color_weak slds-p-vertical_medium">
                            No more records.
                        </div>
                    </template>
                </div>
            </lightning-layout-item>

            <lightning-layout-item padding="around-small" class="custom-box2">
                <div class="slds-text-heading_large">Qualification</div>
                <div data-id="qualificationList" style="height:100%" data-role="drop-target" ondrop={handleDrop}
                    class="scroll-zone slds-scrollable_y" ondragenter={handleDragEnter} onscroll={handleScroll}
                    ondragover={handleDragOver} ondragleave={handleDragLeave}>
                    <template if:true={qualificationList}>
                        <template for:each={qualificationList} for:item="data">
                            <div key={data.Id} draggable="true" id={data.Id} data-id={data.Id}
                                ondragstart={taskDragStart} ondragend={taskDragEnd} class="slds-p-around_small">
                                <lightning-card style="padding: 10px;" variant="Narrow">
                                    <div class="slds-p-around_medium">
                                        <p><strong>{data.Name}</strong></p>
                                        <p>{data.Amount}</p>
                                        <p>{data.StageName}</p>
                                        <div style="display: flex; justify-content: space-between;">
                                            <lightning-button label="Edit" title="Non-primary action"
                                                onclick={handleEditClick} data-id={data.Id}
                                                class="slds-m-left_x-small"></lightning-button>
                                            <lightning-button label="Delete" title="Non-primary action"
                                                onclick={handledeleteClick} data-id={data.Id}
                                                class="slds-m-left_x-small"></lightning-button>
                                        </div>
                                    </div>
                                </lightning-card>
                            </div>
                        </template>
                    </template>
                    <template if:true={isLoadingQualification}>
                        <div class="slds-align_absolute-center slds-p-vertical_medium">
                            <lightning-spinner alternative-text="Loading..." size="small"></lightning-spinner>
                        </div>
                    </template>
                    <template if:true={allDoneQualification}>
                        <div class="slds-text-align_center slds-text-color_weak slds-p-vertical_medium">
                            No more records.
                        </div>
                    </template>
                </div>
            </lightning-layout-item>

            <lightning-layout-item padding="around-small" class="custom-box3">
                <div class="slds-text-heading_large">Proposal</div>
                <div data-id="proposalList" style="height:100%" data-role="drop-target" ondrop={handleDrop}
                    class="scroll-zone slds-scrollable_y" ondragenter={handleDragEnter} onscroll={handleScroll}
                    ondragover={handleDragOver} ondragleave={handleDragLeave}>
                    <template if:true={proposalList}>
                        <template for:each={proposalList} for:item="data">
                            <div key={data.Id} draggable="true" id={data.Id} data-id={data.Id}
                                ondragstart={taskDragStart} ondragend={taskDragEnd} class="slds-p-around_small">
                                <lightning-card style="padding: 10px;" variant="Narrow">
                                    <div class="slds-p-around_medium">
                                        <p><strong>{data.Name}</strong></p>
                                        <p>{data.Amount}</p>
                                        <p>{data.StageName}</p>
                                        <div style="display: flex; justify-content: space-between;">
                                            <lightning-button label="Edit" title="Non-primary action"
                                                onclick={handleEditClick} data-id={data.Id}
                                                class="slds-m-left_x-small"></lightning-button>
                                            <lightning-button label="Delete" title="Non-primary action"
                                                onclick={handledeleteClick} data-id={data.Id}
                                                class="slds-m-left_x-small"></lightning-button>
                                        </div>
                                    </div>
                                </lightning-card>
                            </div>
                        </template>
                    </template>
                    <template if:true={isLoadingProposal}>
                        <div class="slds-align_absolute-center slds-p-vertical_medium">
                            <lightning-spinner alternative-text="Loading..." size="small"></lightning-spinner>
                        </div>
                    </template>
                    <template if:true={allDoneProposal}>
                        <div class="slds-text-align_center slds-text-color_weak slds-p-vertical_medium">
                            No more records.
                        </div>
                    </template>
                </div>
            </lightning-layout-item>

            <lightning-layout-item padding="around-small" class="custom-box4">
                <div class="slds-text-heading_large">Closed Won</div>
                <div data-id="closedWonList" style="height:100%" data-role="drop-target" ondrop={handleDrop}
                    class="scroll-zone slds-scrollable_y" ondragenter={handleDragEnter} onscroll={handleScroll}
                    ondragover={handleDragOver} ondragleave={handleDragLeave}>
                    <template if:true={closedWonList}>
                        <template for:each={closedWonList} for:item="data">
                            <div key={data.Id} draggable="true" id={data.Id} data-id={data.Id}
                                ondragstart={taskDragStart} ondragend={taskDragEnd} class="slds-p-around_small">
                                <lightning-card style="padding: 10px;" variant="Narrow">
                                    <div class="slds-p-around_medium">
                                        <p><strong>{data.Name}</strong></p>
                                        <p>{data.Amount}</p>
                                        <p>{data.StageName}</p>
                                        <div style="display: flex; justify-content: space-between;">
                                            <lightning-button label="Edit" title="Non-primary action"
                                                onclick={handleEditClick} data-id={data.Id}
                                                class="slds-m-left_x-small"></lightning-button>
                                            <lightning-button label="Delete" title="Non-primary action"
                                                onclick={handledeleteClick} data-id={data.Id}
                                                class="slds-m-left_x-small"></lightning-button>
                                        </div>
                                    </div>
                                </lightning-card>
                            </div>
                        </template>
                    </template>
                    <template if:true={isLoadingClosedWon}>
                        <div class="slds-align_absolute-center slds-p-vertical_medium">
                            <lightning-spinner alternative-text="Loading..." size="small"></lightning-spinner>
                        </div>
                    </template>
                    <template if:true={allDoneClosedWon}>
                        <div class="slds-text-align_center slds-text-color_weak slds-p-vertical_medium">
                            No more records.
                        </div>
                    </template>
                </div>
            </lightning-layout-item>

            <lightning-layout-item padding="around-small" class="custom-box4">
                <div class="slds-text-heading_large">Closed Lost</div>
                <div data-id="closedLostList" class="scroll-zone slds-scrollable_y" style="height:100%"
                    data-role="drop-target" ondrop={handleDrop} ondragenter={handleDragEnter}
                    onscroll={handleScroll} ondragover={handleDragOver} ondragleave={handleDragLeave}>
                    <template if:true={closedLostList}>
                        <template for:each={closedLostList} for:item="data">
                            <div key={data.Id} draggable="true" id={data.Id} data-id={data.Id}
                                ondragstart={taskDragStart} ondragend={taskDragEnd} class="slds-p-around_small">
                                <lightning-card style="padding: 10px;" variant="Narrow">
                                    <div class="slds-p-around_medium">
                                        <p><strong>{data.Name}</strong></p>
                                        <p>{data.Amount}</p>
                                        <p>{data.StageName}</p>
                                        <div style="display: flex; justify-content: space-between;">
                                            <lightning-button label="Edit" title="Non-primary action"
                                                onclick={handleEditClick} data-id={data.Id}
                                                class="slds-m-left_x-small"></lightning-button>
                                            <lightning-button label="Delete" title="Non-primary action"
                                                onclick={handledeleteClick} data-id={data.Id}
                                                class="slds-m-left_x-small"></lightning-button>
                                        </div>
                                    </div>
                                </lightning-card>
                            </div>
                        </template>
                    </template>
                    <template if:true={isLoadingClosedLost}>
                        <div class="slds-align_absolute-center slds-p-vertical_medium">
                            <lightning-spinner alternative-text="Loading..." size="small"></lightning-spinner>
                        </div>
                    </template>
                    <template if:true={allDoneClosedLost}>
                        <div class="slds-text-align_center slds-text-color_weak slds-p-vertical_medium">
                            No more records.
                        </div>
                    </template>
                </div>
            </lightning-layout-item>
        </lightning-layout>
    </div>
</template>
