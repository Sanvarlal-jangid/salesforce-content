<template>
    <lightning-card title="Student Test Results">
        <div style="height: 400px;">
            <lightning-datatable
                key-field="Id"
                data={datalist}
                columns={columns}
                sorted-by={sortBy}
                sorted-direction={sortDirection}
                onsort={doSorting}
                onrowaction={handleRowAction}
                onrowselection={handleRowSelection}>
            </lightning-datatable>
        </div>

        <template if:true={showViewModal}>
            <section role="dialog" class="slds-modal slds-fade-in-open">
                <div class="slds-modal__container">
                    <header class="slds-modal__header">
                        <h2 class="slds-modal__title">Contact Details</h2>
                    </header>
                    <div class="slds-modal__content slds-p-around_medium">
                        <lightning-record-view-form record-id={selectedRecordId} object-api-name="Mock_test_Result__c">
                            <div class="slds-grid slds-wrap">
                                <div class="slds-col slds-size_1-of-2">
                                    <lightning-output-field field-name="Test_name__c"></lightning-output-field>
                                    <lightning-output-field field-name="Student__r.Name"></lightning-output-field>
                                    <lightning-output-field field-name="Student__c"></lightning-output-field>
                                </div>
                                <div class="slds-col slds-size_1-of-2">
                                    <lightning-output-field field-name="Date_of_attempt__c"></lightning-output-field>
                                    <lightning-output-field field-name="Result_Status__c"></lightning-output-field>
                                    <lightning-output-field field-name="Score__c"></lightning-output-field>
                                </div>
                            </div>
                        </lightning-record-view-form>
                    </div>
                    <footer class="slds-modal__footer">
                        <lightning-button variant="neutral" label="Close" onclick={closeModal}></lightning-button>
                    </footer>
                </div>
            </section>
            <div class="slds-backdrop slds-backdrop_open"></div>
        </template>
    </lightning-card>
</template>
