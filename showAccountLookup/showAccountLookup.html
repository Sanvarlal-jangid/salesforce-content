<template>
    <lightning-card title="Search Account" icon-name="standard:search">
        <lightning-record-picker label="Accounts" placeholder="Search Accounts" object-api-name="Account"
            filter={filter} display-info={displayInfo} matching-info={matchingInfo} onchange={handlechange}>
        </lightning-record-picker>
    </lightning-card>
    <lightning-layout>
        <lightning-layout-item>
            <lightning-datatable columns={columns} data={contactList} key-field="Id"
                onrowselection={handlerowselection}></lightning-datatable>
        </lightning-layout-item>
    </lightning-layout>
    <template if:true={showSpinner}>
        <div class="slds-box slds-text-align_center">
            <lightning-spinner alternative-text="Loading" size="large"></lightning-spinner>
        </div>
    </template>
    <div style="text-align: center;">
        <lightning-button label="Delete Contact" onclick={handleDelete} variant="destructive"></lightning-button>
    </div>
</template>
