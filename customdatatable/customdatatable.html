<template>
    <lightning-card title="Opportunity Creator" icon-name="standard:opportunity">
        <div class="slds-m-around_medium">
            <div class="slds-grid slds-wrap slds-gutters">
                <div class="slds-col slds-size_1-of-2">
                    <lightning-combobox label="Select an Account"
                        value={accountId} options={options} onchange={handleComboboxChange}>
                    </lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <lightning-combobox label="contacts"
                        value={contactId} options={contactoptions} onchange={handleContactChange}>
                    </lightning-combobox>
                </div>
            </div>

            <div class="slds-grid slds-wrap slds-gutters slds-m-top_medium">
                <div class="slds-col slds-size_1-of-2">
                    <lightning-combobox label="Pricebook"
                        value={pricebookId} options={pricebookoptions} onchange={handlePricebookChange}>
                    </lightning-combobox>
                </div>
                <div class="slds-col slds-size_1-of-2">
                    <lightning-input type="date" label="Closed Date" value={closedDate}
                        onchange={handleClosedDateChange}>
                    </lightning-input>
                </div>
            </div>

            <div class="slds-m-top_large">
                <h2 class="slds-text-heading_medium slds-m-bottom_small">Products</h2>
                <table class="slds-table slds-table_cell-buffer slds-table_bordered slds-table_striped">
                    <thead>
                        <tr class="slds-line-height_reset">
                            <th scope="col">
                                <div class="slds-truncate" title="Nr.">Nr.</div>
                            </th>
                            <th scope="col">
                                <div class="slds-truncate" title="Product">Product</div>
                            </th>
                            <th scope="col">
                                <div class="slds-truncate" title="Quantity">Quantity</div>
                            </th>
                            <th scope="col">
                                <div class="slds-truncate" title="Unit Price">Unit Price</div>
                            </th>
                            <th scope="col">
                                <div class="slds-truncate" title="List Price">List Price</div>
                            </th>
                            <th scope="col">
                                <div class="slds-truncate" title="Total">Total</div>
                            </th>
                            <th scope="col">
                                <div class="slds-truncate" title="Actions"></div>
                            </th>
                        </tr>
                    </thead>
                    <tbody>
                        <template for:each={opportunityLineItems} for:item="item" for:index="index">
                            <tr key={item.key}>
                                <td>{item.index}</td>
                                <td>
                                    <lightning-combobox name="product" label="Product" value={item.ProductId}
                                        placeholder="Select Product" options={availableProducts}
                                        onchange={handleProductChange} data-index={index}
                                        class="product-combobox"></lightning-combobox>
                                </td>
                                <td>
                                    <lightning-input type="number" label="Quantity" value={item.Quantity}
                                        onchange={handleQuantityChange} data-index={index}
                                        class="quantity-input"></lightning-input>
                                </td>
                                <td>
                                    <lightning-input type="number" label="Unit Price" value={item.UnitPrice}
                                        onchange={handleUnitPriceChange} data-index={index}  read-only>
                                    </lightning-input>
                                </td>
                                <td>
                                    <lightning-input type="number" label="List Price" value={item.ListPrice}
                                        read-only></lightning-input>
                                </td>
                                <td>
                                    <lightning-input type="number" label="Total" value={item.Total}
                                        read-only></lightning-input>
                                </td>
                                <td>
                                    <lightning-button-icon icon-name="utility:delete" variant="bare"
                                        alternative-text="Delete Row" title="Delete Row"
                                        onclick={handleDeleteRow} data-index={index}>
                                    </lightning-button-icon>
                                </td>
                            </tr>
                        </template>
                    </tbody>
                </table>
                <div class="slds-m-top_medium">
                    <lightning-button label="Add Additional Row" icon-name="utility:add" onclick={addRow}
                        class="slds-m-right_small"></lightning-button>
                    <lightning-button label="Delete All Rows" icon-name="utility:delete" onclick={handleDeleteAllRows}
                        class=" slds-m-right_small"></lightning-button>
                    <lightning-button label="Create Opportunity" icon-name="utility:save"
                        onclick={handleCreateOpportunity} variant="brand"></lightning-button>
                </div>
            </div>
        </div>
    </lightning-card>
</template>
